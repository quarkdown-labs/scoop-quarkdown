name: Test manifest against devbuild

# Installs the manifest with its download source swapped to Quarkdown's `latest`
# devbuild release, then smoke-tests HTML and PDF compilation.
# This validates manifest changes before a stable release ships them.
# See quarkdown-labs/installation-tests for the equivalent tests against real releases.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Scoop, install and test
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

          # Point the manifest at the latest devbuild
          $url = "https://github.com/iamgio/quarkdown/releases/download/latest/quarkdown-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile devbuild.zip -UseBasicParsing
          $hash = (Get-FileHash devbuild.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content bucket\quarkdown.json -Raw | ConvertFrom-Json
          $manifest.url = $url
          $manifest.hash = $hash
          $manifest | ConvertTo-Json -Depth 8 | Set-Content bucket\quarkdown.json

          scoop install .\bucket\quarkdown.json

          $content = ".docname {test}"
          $content | Out-File -FilePath main.qd -Encoding utf8

          quarkdown c main.qd -o ./output

          Get-ChildItem -Path ./output

          if (-Not (Test-Path -Path "./output/test")) {
            Write-Error "Output directory not found"
          }

          quarkdown c main.qd -o ./output --pdf

          Get-ChildItem -Path ./output

          if (-Not (Test-Path -Path "./output/test.pdf")) {
            Write-Error "Output PDF not found"
          }
